[project]
name = "privateemail-mcp"
version = "1.1.1"
description = "MCP server for Namecheap PrivateEmail via IMAP and SMTP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Cipher Solutions" }
]
keywords = ["mcp", "claude-code", "email", "namecheap", "privateemail", "imap", "smtp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "mcp[cli]>=1.6.0",
  "aiosmtplib>=3.0.0",
  "aioimaplib>=1.1.0",
  "beautifulsoup4>=4.12.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/ciphersolutions-dev/private-email-mcp"
Repository = "https://github.com/ciphersolutions-dev/private-email-mcp"
Issues = "https://github.com/ciphersolutions-dev/private-email-mcp/issues"

[project.scripts]
privateemail-mcp = "privateemail_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privateemail_mcp"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
